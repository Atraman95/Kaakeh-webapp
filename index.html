<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Kaakeh Ops has moved</title>
<link rel="icon" href="Logo.png"/>
<!-- Anyone reaching this old address out of habit is sent to the live app.
     The delay is only long enough to read the line of text. -->
<meta http-equiv="refresh" content="3;url=https://ops.kaakeh.ae/"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#f5f0e8;font-family:'Tajawal',sans-serif;color:#1a120b;
       display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem}
  .band{position:fixed;top:0;left:0;width:100%;height:6px;
        background:linear-gradient(90deg,#6b1f1f,#c9a84c,#6b1f1f)}
  .card{background:#fff;border:1px solid rgba(201,168,76,.25);border-radius:2px;
        padding:3.5rem 3rem;max-width:460px;width:100%;text-align:center;
        box-shadow:0 2px 8px rgba(26,18,11,.06),0 20px 60px rgba(26,18,11,.08)}
  .brand{font-size:.8rem;font-weight:500;letter-spacing:.25em;color:#6b1f1f;
         text-transform:uppercase;margin-bottom:1.25rem}
  h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:600;color:#6b1f1f;
     line-height:1.3;margin-bottom:1rem}
  p{font-size:.95rem;font-weight:300;color:#8b6f47;line-height:1.7}
  .go{display:inline-block;margin-top:1.75rem;padding:.8rem 1.6rem;background:#6b1f1f;color:#fff;
      text-decoration:none;border-radius:2px;font-size:.9rem;letter-spacing:.04em}
  .small{margin-top:1.5rem;font-size:.78rem;color:#b0977a}
  @media (max-width:480px){.card{padding:2.5rem 1.75rem}}
</style></head><body>
<div class="band"></div>
<div class="card">
  <div class="brand"><span lang="ar">كعكة</span> &nbsp;·&nbsp; Kaakeh</div>
  <h1>This address has moved</h1>
  <p>The orders app now lives at <strong>ops.kaakeh.ae</strong>.</p>
  <a class="go" href="https://ops.kaakeh.ae/">Go to the app</a>
  <div class="small">Taking you there automatically…</div>
</div>
<script>
  // Belt and braces: the meta refresh above covers browsers with JS disabled.
  setTimeout(function () { location.replace('https://ops.kaakeh.ae/'); }, 3000);
</script>
</body></html>
